<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expedition Chronicles</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f0e6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 500px;
      padding: 20px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    h2 {
      font-weight: normal;
      color: #666;
      margin-bottom: 40px;
    }

    button {
      padding: 15px 30px;
      font-size: 1.1rem;
      border: none;
      border-radius: 10px;
      background: #2f6b3f;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #245331;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Expedition Chronicles</h1>
    <h2>Family Adventures. Forever.</h2>

    <button onclick="startExpedition()">
      Rozpocznij Ekspedycję
    </button>
  </div>

  <script>
    function startExpedition() {
      alert("Namibia Quest v0.1 rozpocznie się tutaj.");
    }
  </script>

</body>
</html>
